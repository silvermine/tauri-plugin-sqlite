[package]
name = "sqlx-sqlite-toolkit"
# Sync major.minor with major.minor of SQLx crate
version = "0.9.1"
license = "MIT"
edition = "2024"
rust-version = "1.94.0"
authors = ["Jeremy Thomerson"]
description = "High-level SQLite API built on sqlx with builder-pattern queries, transactions, and JSON decoding"
repository = "https://github.com/silvermine/tauri-plugin-sqlite"
readme = "README.md"
keywords = ["sqlite", "sqlx", "database", "transactions", "async"]
categories = ["database", "asynchronous"]

[features]
default = []
observer = ["dep:sqlx-sqlite-observer"]

[dependencies]
sqlx-sqlite-conn-mgr = { path = "../sqlx-sqlite-conn-mgr", version = "0.9.0" }
sqlx-sqlite-observer = { path = "../sqlx-sqlite-observer", version = "0.9.1", features = ["conn-mgr"], optional = true }
sqlx = { version = "0.9.0", features = ["sqlite", "json", "time", "runtime-tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
indexmap = { version = "2.12", features = ["serde"] }
base64 = "0.22"
time = "0.3.47"
uuid = { version = "1.11", features = ["v4"] }
tokio = { version = "1.54.1", features = ["sync", "rt"] }
tracing = { version = "0.1", default-features = false, features = ["std", "release_max_level_off"] }

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
rstest = { version = "0.28.0", default-features = false }
