[package]
name = "sqlx-sqlite-conn-mgr"
# Sync major.minor with major.minor of SQLx crate
version = "0.9.0"
description = "Wraps SQLx for SQLite, enforcing pragmatic connection policies for mobile and desktop applications"
authors = ["Jeremy Thomerson"]
license = "MIT"
edition = "2024"
rust-version = "1.94.0"
repository = "https://github.com/silvermine/tauri-plugin-sqlite"
readme = "README.md"
keywords = ["sqlite", "sqlx", "database", "connection-pool", "async"]
categories = ["database", "asynchronous"]

[dependencies]
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate"] }
thiserror = "2.0.17"
tokio = { version = "1.54.1", features = ["full"] }
tracing = { version = "0.1.44", default-features = false, features = ["std", "release_max_level_off"] }
serde = { version = "1.0.228", features = ["derive"] }
parking_lot = "0.12.3"
# Registers consumer-supplied scalar functions on every pooled connection.
# Pinned to the version sqlx-sqlite links: only one version of a `links`
# crate can exist in a dependency graph.
libsqlite3-sys = "0.35.0"

[dev-dependencies]
tempfile = "3.24.0"
rstest = { version = "0.28.0", default-features = false }
